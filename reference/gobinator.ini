# GOBINATOR FORMAT. LINE DELAMINATED. PROPERTY FOLLOWED BY VALUE. DO NOT SKIP LINES.
#
# You can associate GOB files w/ GOBINATOR. Then, when you double
# click them, GOBINATOR **copies** the GOB into your MOD folder,
# so that it's the only episode on your list.
#
# IMPORTANT: GOBINATOR also **AUTO-MANAGES** your MOD_FOLDER!
# That means it will delete ANY .gob files it finds in there
# that are not specified in a MOD_FOLDER_PURGE_EXCLUDE_FILE
# definition below.
# 
# Again - make sure you only ever put COPIES of your GOBs into
# your MOD_FOLDER, and if you want a GOB to not get purged, you
# must specify it as one of the MOD_FOLDER_PURGE_EXCLUDE_FILE
# files below, just like how BFP, JKE, and JKR get ignored.
#
# !!WARNING!! Your MOD_FOLDER will be auto-purged of all GOBs!
# !!WARNING!! **NEVER** STORE YOUR OWN GOBS IN THE MOD_FOLDER! IT IS AUTO-MANAGED!
MOD_FOLDER
mod
JK_EXECUTABLE
inject.exe
ADDITIONAL_LAUNCH_OPTIONS
-devmode
MOD_FOLDER_PURGE_EXCLUDE_FILE
BFP2X.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
JKE.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
JKR.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
war.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
Scope_v1.0Beta.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
KCSJ_Beta.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
shelvapatch10.gob
MOD_FOLDER_PURGE_EXCLUDE_FILE
XtremeFinWarfare.gob
BFP_RANDOMIZE_CHARACTER_FILE
H:\SteamLibrary\steamapps\common\Star Wars Jedi Knight Remastered\player\SM Sith Lord\BFP Random.mpc
BFP_RANDOMIZE_MODEL
1
BFP_RANDOMIZE_SABER
0