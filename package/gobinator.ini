# gobinator.ini - Gobinator's settings. Keep this file beside gobinator.exe (if it is missing, Gobinator
# writes a fresh one like this).
#
# Double-click an episode .gob and Gobinator copies it into JK's Episode folder (unless it is there
# already; it stays there), makes an empty folder of the same name beside it, which puts the episode at
# the top of JK's episode list (it removes the one it made for the episode before), and starts JK with
# -path mod. On OpenJKDF2 (v0.9.9 or later, with General > "Disable mission start confirmation" turned on)
# it starts straight into the episode's first level; a multiplayer episode starts as a game hosted on this
# PC, with you in it. A mod (a GOB with no episode in it) is left where it is, and JK starts at its menu.
# Start gobinator.exe itself to remove that folder and get JK's usual episode list back.
#
# Every setting is optional: with none, Gobinator works from the JK folder it sits in.
# Write a setting as   NAME = value   and remove the # in front of it. Lines starting with # or ; are notes.

# Where JK is, if gobinator.exe is not in the JK folder. When no JK program is found, Gobinator asks for
# the folder and writes the answer here.
# JK_FOLDER = C:\Program Files (x86)\Steam\steamapps\common\Star Wars Jedi Knight

# The folder inside the JK folder for your own mods: JK starts with -path <it>, so they load on top of the
# episode. Gobinator never touches what you keep there. No spaces. Default: mod
# MOD_FOLDER = mod

# The program to start. Default: found in the JK folder, in this order: inject.exe with jkgm.json
# (JK Remastered), openjkdf2-64.exe (OpenJKDF2), JediKnight.exe, JK.EXE.
# JK_EXECUTABLE = JK.EXE

# Options for JK, put before -path. Default: -devmode, which adds Debug to the Singleplayer menu:
# Singleplayer > Debug > the episode > the level is the quickest way into a level.
# ADDITIONAL_LAUNCH_OPTIONS = -devmode
